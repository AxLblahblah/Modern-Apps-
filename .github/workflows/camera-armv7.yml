name: camera-armv7

on:
  workflow_dispatch:
  push:
    branches:
      - "vibe/camera-armv7*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NDK
        run: |
          SDKM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.14206865" > /dev/null

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: keystore/
          key: ma-camera-release-keystore-v1

      - name: Generate release keystore (first run only)
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/ma-camera-release.keystore \
            -alias ma-camera \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass macamera-release -keypass macamera-release \
            -dname "CN=MA Camera (fork build)"

      - name: CI Gradle heap (per CONTRIBUTING.md)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
          org.gradle.workers.max=2
          EOF

      - name: Build MA Camera (armeabi-v7a only, release, optimized Rust)
        run: >
          ./gradlew :camera:assembleRelease
          -Pmodernapps.rustProfile=release
          -Parmv7Modelrunner=true
          -PRELEASE_STORE_FILE="${{ github.workspace }}/keystore/ma-camera-release.keystore"
          -PRELEASE_STORE_PASSWORD=macamera-release
          -PRELEASE_KEY_ALIAS=ma-camera
          -PRELEASE_KEY_PASSWORD=macamera-release
          -x lintVitalRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ma-camera-armv7-release
          path: camera/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload keystore (keep it to keep the signature stable across updates)
        uses: actions/upload-artifact@v4
        with:
          name: ma-camera-release-keystore
          path: keystore/
          if-no-files-found: error
